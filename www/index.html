<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>FPV Controller</title>
<style>
  :root{--bg:#0b0d10;--panel:#151a20;--line:#27303a;--fg:#e8edf2;--dim:#7d8a98;--acc:#2ee6a6;--warn:#ff5d5d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:grid;grid-template-columns:1fr minmax(180px,26vw) 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .zone{position:relative;display:flex;align-items:center;justify-content:center}
  .base{position:relative;width:min(62vh,36vw);height:min(62vh,36vw);border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,#10151a 0,#0d1115 70%)}
  .base::before,.base::after{content:"";position:absolute;background:var(--line)}
  .base::before{left:50%;top:8%;bottom:8%;width:1px}
  .base::after{top:50%;left:8%;right:8%;height:1px}
  .knob{position:absolute;left:50%;top:50%;width:34%;height:34%;margin:-17% 0 0 -17%;border-radius:50%;background:var(--acc);opacity:.85;box-shadow:0 0 24px #2ee6a655}
  .lbl{position:absolute;bottom:6%;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  #mid{display:flex;flex-direction:column;gap:10px;justify-content:center;padding:10px}
  .btn{padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-align:center;font-weight:600;font-size:14px}
  .btn.on{background:var(--acc);color:#04130d;border-color:var(--acc)}
  .btn.arm.on{background:var(--warn);border-color:var(--warn);color:#1a0505}
  .btn:active{filter:brightness(1.3)}
  #status{text-align:center;color:var(--dim);font-size:12px}
  #status b{color:var(--warn)} #status.ok b{color:var(--acc)}
  #gear{position:absolute;top:8px;right:12px;width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:5}
  #settings{position:fixed;inset:0;background:#0b0d10ee;display:none;align-items:center;justify-content:center;z-index:10}
  #settings.open{display:flex}
  #card{width:min(520px,92vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;touch-action:pan-y}
  #card h2{margin:0 0 10px;font-size:16px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
  .row label{color:var(--dim)}
  input[type=text],input[type=number],select{background:#0d1115;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;width:55%;font-size:14px;user-select:text;-webkit-user-select:text;touch-action:auto}
  input[type=range]{width:55%;touch-action:auto}
  #rot{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;z-index:20;color:var(--dim)}
  @media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div class="zone" id="zL"><div class="base"><div class="knob" id="kL"></div></div><div class="lbl">Throttle / Yaw</div></div>
  <div id="mid">
    <div id="status"><b>●</b> <span id="stxt">Not connected</span></div>
    <div class="btn arm" id="bArm">ARM</div>
    <div class="btn" id="bMode">ANGLE</div>
    <div class="btn" id="bReset">RESET</div>
    <div class="btn" id="bTurtle">TURTLE</div>
  </div>
  <div class="zone" id="zR"><div class="base"><div class="knob" id="kR"></div></div><div class="lbl">Pitch / Roll</div></div>
</div>
<div id="gear">⚙</div>
<div id="rot">Rotate your phone<br>to landscape</div>

<div id="settings"><div id="card">
  <h2>Settings</h2>
  <div class="row"><label>PC address (IP:port)</label><input type="text" id="host" placeholder="192.168.1.50:8765" autocapitalize="off" autocomplete="off"></div>
  <div class="row"><label>Stick mode</label><select id="mode"><option value="2">Mode 2 (throttle left)</option><option value="1">Mode 1 (throttle right)</option></select></div>
  <div class="row"><label>Expo <span id="expoV"></span></label><input type="range" id="expo" min="0" max="80" value="25"></div>
  <div class="row"><label>Throttle springs to center</label><input type="checkbox" id="thrSpring"></div>
  <div class="row"><label>Tilt phone for pitch/roll (gyro)</label><input type="checkbox" id="gyro"></div>
  <div class="row"><label>Vibration feedback</label><input type="checkbox" id="vib" checked></div>
  <div class="row"><button class="btn" id="save" style="width:100%">Save &amp; connect</button></div>
  <div style="color:var(--dim);font-size:12px">On your PC run <code>pc/server.py</code>; it prints the address to enter here.</div>
</div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const served=/^https?:$/.test(location.protocol)&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const cfg={
  host:store.get('host',served?location.host:''),
  mode:store.get('mode','2'),
  expo:store.get('expo',25),
  thrSpring:store.get('thrSpring',false),
  gyro:store.get('gyro',false),
  vib:store.get('vib',true)
};

const st={yaw:0,thr:-1,roll:0,pitch:0,arm:false,aux:false,reset:false,turtle:false};
let tilt={roll:0,pitch:0};
const buzz=ms=>{if(cfg.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};

function stick(zone,knob,onMove,onEnd){
  const base=zone.querySelector('.base');let id=null;
  const upd=e=>{
    const r=base.getBoundingClientRect(),R=r.width/2,k=R*0.66;
    let dx=(e.clientX-(r.left+R))/k,dy=(e.clientY-(r.top+R))/k;
    const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
    knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;
    onMove(dx,-dy);
  };
  zone.addEventListener('pointerdown',e=>{if(id!==null)return;id=e.pointerId;zone.setPointerCapture(id);upd(e);e.preventDefault()});
  zone.addEventListener('pointermove',e=>{if(e.pointerId===id)upd(e)});
  const end=e=>{if(e.pointerId!==id)return;id=null;onEnd(knob)};
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
}
const setKnob=(knob,x,y)=>{const base=knob.parentElement,k=base.getBoundingClientRect().width/2*0.66;knob.style.transform=`translate(${x*k}px,${-y*k}px)`};
const expoF=v=>{const e=cfg.expo/100;return (1-e)*v+e*v*v*v};

const A={};
A.L={x:0,y:-1};A.R={x:0,y:0};
function applyMapping(){
  const left=A.L,right=A.R;
  const thr=cfg.mode==='2'?left:right, att=cfg.mode==='2'?right:left;
  st.yaw=expoF(thr.x);st.thr=thr.y;
  st.roll=expoF(att.x);st.pitch=expoF(att.y);
  if(cfg.gyro){st.roll=clamp(st.roll+tilt.roll);st.pitch=clamp(st.pitch+tilt.pitch)}
}
const clamp=v=>Math.max(-1,Math.min(1,v));
function resetKnobs(){
  A.L={x:0,y:-1};A.R={x:0,y:0};
  setKnob($('kL'),0,-1);setKnob($('kR'),0,0);
}
function makeStick(zoneId,knobId,side){
  const isThrSide=()=>(cfg.mode==='2')===(side==='L');
  stick($(zoneId),$(knobId),(x,y)=>{A[side]={x,y};applyMapping()},knob=>{
    const cur=A[side];
    if(isThrSide()&&!cfg.thrSpring){A[side]={x:0,y:cur.y};setKnob(knob,0,cur.y)}
    else{A[side]={x:0,y:0};setKnob(knob,0,0)}
    applyMapping();
  });
}
makeStick('zL','kL','L');makeStick('zR','kR','R');

function latch(el,key,label){
  el.addEventListener('pointerdown',e=>{st[key]=!st[key];el.classList.toggle('on',st[key]);if(label)el.textContent=label[st[key]?1:0];buzz(st[key]?40:15);e.preventDefault()});
}
function hold(el,key){
  el.addEventListener('pointerdown',e=>{st[key]=true;el.classList.add('on');buzz(20);e.preventDefault()});
  const up=()=>{st[key]=false;el.classList.remove('on')};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
}
latch($('bArm'),'arm',['ARM','ARMED']);latch($('bMode'),'aux',['ANGLE','ACRO']);hold($('bReset'),'reset');hold($('bTurtle'),'turtle');

function onOri(e){
  if(e.beta==null)return;
  const land=(screen.orientation&&screen.orientation.angle)||window.orientation||90;
  let roll,pitch;
  if(land===270||land===-90){roll=-e.beta/35;pitch=e.gamma/35}else{roll=e.beta/35;pitch=-e.gamma/35}
  tilt={roll:clamp(roll),pitch:clamp(pitch)};applyMapping();
}
async function enableGyro(on){
  if(!on){window.removeEventListener('deviceorientation',onOri);tilt={roll:0,pitch:0};return}
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){await DeviceOrientationEvent.requestPermission()}}catch(e){}
  window.addEventListener('deviceorientation',onOri);
}

let ws=null,connected=false,retry=null,lastSent='',lastTx=0;
const setStatus=(ok,t)=>{$('status').className=ok?'ok':'';$('stxt').textContent=t};
function connect(){
  clearTimeout(retry);if(ws){try{ws.onclose=null;ws.close()}catch(e){}}
  if(!cfg.host){setStatus(false,'Set PC address in ⚙');return}
  setStatus(false,'Connecting…');
  try{ws=new WebSocket('ws://'+cfg.host+'/ws')}catch(e){setStatus(false,'Bad address');return}
  ws.onopen=()=>{connected=true;setStatus(true,'Connected');buzz(60)};
  ws.onclose=()=>{connected=false;setStatus(false,'Reconnecting…');retry=setTimeout(connect,1500)};
  ws.onerror=()=>{};
}
function packet(){
  const f=v=>Math.round(v*1000)/1000;
  const b=(st.arm?1:0)|(st.aux?2:0)|(st.reset?4:0)|(st.turtle?8:0);
  return JSON.stringify({a:[f(st.yaw),f(st.thr),f(st.roll),f(st.pitch)],b});
}
setInterval(()=>{
  if(!connected||ws.readyState!==1)return;
  const p=packet(),now=performance.now();
  if(p!==lastSent||now-lastTx>100){ws.send(p);lastSent=p;lastTx=now}
},12);

const openS=()=>{$('host').value=cfg.host;$('mode').value=cfg.mode;$('expo').value=cfg.expo;$('expoV').textContent=cfg.expo+'%';$('thrSpring').checked=cfg.thrSpring;$('gyro').checked=cfg.gyro;$('vib').checked=cfg.vib;$('settings').classList.add('open')};
$('gear').addEventListener('click',openS);
$('expo').addEventListener('input',()=>$('expoV').textContent=$('expo').value+'%');
$('save').addEventListener('click',()=>{
  cfg.host=$('host').value.trim();cfg.mode=$('mode').value;cfg.expo=+$('expo').value;cfg.thrSpring=$('thrSpring').checked;cfg.gyro=$('gyro').checked;cfg.vib=$('vib').checked;
  for(const k in cfg)store.set(k,cfg[k]);
  $('settings').classList.remove('open');resetKnobs();applyMapping();enableGyro(cfg.gyro);connect();
});

async function keepAwake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
document.addEventListener('pointerdown',()=>{keepAwake();if(!document.fullscreenElement&&document.documentElement.requestFullscreen&&served)document.documentElement.requestFullscreen().catch(()=>{})},{once:true});
document.addEventListener('contextmenu',e=>e.preventDefault());

resetKnobs();applyMapping();enableGyro(cfg.gyro);
if(!cfg.host)openS();else connect();
})();
</script>
</body>
  </html>
