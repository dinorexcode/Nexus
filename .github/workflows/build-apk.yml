name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Set up Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.fpvcontroller.app",
            "appName": "FPV Controller",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true }
          }
          EOF
          npx cap add android
      - name: Patch Android project
        run: |
          python3 - <<'EOF'
          import pathlib, re
          root = pathlib.Path("android/app/src/main")
          mf = root / "AndroidManifest.xml"
          t = mf.read_text()
          t = t.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          t = re.sub(r"(<activity\b)", r'\1 android:screenOrientation="sensorLandscape"', t, count=1)
          mf.write_text(t)
          java = next(root.glob("java/**/MainActivity.java"))
          java.write_text("""package com.fpvcontroller.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
          """)
          EOF
          npx cap sync android
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: FPV-Controller-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
